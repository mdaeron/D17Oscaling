[project]
name = "D17Oscaling"
version = "1.0.0"
description = "Perform two-point normalization of triple oxygen isotope measurements based on two or more reference materials"
readme = "readme.md"
license = "MIT"
classifiers = ["License :: OSI Approved :: MIT License"]
authors = [
	{ name = "Mathieu Daëron",  email = "mathieu@daeron.fr" },
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "uncertainties>=3.2.3",
]

[project.urls]
Home = "https://github.com/mdaeron/D17Oscaling"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "D17Oscaling"
